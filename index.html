<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAKURA - Class Scanner</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7690;--bd:#e1e6f0;--pr:#3b5bdb;--ok:#12a150;--okb:#dff7e8;--no:#d92d3a;--nob:#fde4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#1a2030;--tx:#e8ecf5;--mu:#93a0bb;--bd:#2a3248;--pr:#7c93f5;--okb:#12341f;--nob:#3a1519}}
:root[data-theme="dark"]{--bg:#10141d;--card:#1a2030;--tx:#e8ecf5;--mu:#93a0bb;--bd:#2a3248;--pr:#7c93f5;--okb:#12341f;--nob:#3a1519}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin-top:6px}
label{font-size:13px;color:var(--mu);display:block;margin-top:10px}
.ck{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--tx);font-size:15px}.ck input{width:auto;margin:0}
button.p{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;font-size:15px;width:100%;margin-top:12px}
button.s{background:transparent;color:var(--pr);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600}
button.d{color:var(--no)}
video{width:100%;border-radius:12px;background:#000;max-height:260px;object-fit:cover;display:none;margin-top:8px}
.res{border-radius:14px;padding:18px;text-align:center;margin-top:12px;display:none}
.res.ok{background:var(--okb);color:var(--ok);display:block}.res.no{background:var(--nob);color:var(--no);display:block}.res.nf{background:var(--bg);color:var(--mu);border:1px solid var(--bd);display:block}
.res b{display:block;font-size:34px;letter-spacing:1px}.res>span{display:block;color:var(--tx);margin-top:4px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap;color:var(--tx)}
.row:last-child{border:0}.row .n{flex:1;min-width:130px}small{color:var(--mu);display:block}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:0}.pill.ok{background:var(--okb);color:var(--ok)}.pill.no{background:var(--nob);color:var(--no)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.brand{background:#fff;color:#000;border-radius:14px;text-align:center;padding:16px 10px 12px;margin:4px 0 8px;border-bottom:4px solid #f2a3b8;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bn{font-size:40px;font-weight:900;letter-spacing:8px;color:#000;line-height:1.1;padding-left:8px}
.bs{font-size:11px;font-weight:700;letter-spacing:2px;color:#000;margin-top:4px}
.ft{max-width:680px;margin:0 auto;text-align:center;color:var(--mu);font-size:12px;letter-spacing:1.5px;padding:6px 14px 22px}
.ft b{color:var(--tx);font-weight:800}
.hid{display:none}
</style></head><body><div class="w">
<div class="brand"><div class="bn">SAKURA</div><div class="bs">HIGHER EDUCATION CENTER · PADIYATALAWA</div></div>
<div class="sub" style="text-align:center">Scan student card → record that today's class was given</div>
<div class="tabs"><button data-t="scan" class="on">Scan</button><button data-t="list">Students</button><button data-t="cls">Classes</button></div>

<div id="t-scan"><div class="c">
<label style="margin-top:0">Scan card (USB scanner types here) or type the code + Enter</label>
<input id="man" placeholder="Scan card now…" autocomplete="off" autofocus>
<button class="s" id="cam" style="margin-top:8px">📷 Use phone camera</button>
<video id="vid" playsinline muted></video>
<div class="res" id="res"></div></div></div>

<div id="t-list" class="hid">
<div class="c"><button class="p" id="addtog" style="margin:0">+ Add student</button>
<div id="sf" class="hid">
<label>Student name</label><input id="sn">
<label>Card code (click here, then scan the card)</label><input id="sc" autocomplete="off">
<label>Classes</label><div id="sk"></div>
<button class="p" id="ss">Save student</button></div></div>
<div class="c"><input id="q" placeholder="Search name / code" style="margin:0 0 6px"><div id="lst"></div></div>
<div class="c"><button class="s" id="exp">Backup (download)</button> <button class="s" id="imp">Restore</button><input type="file" id="fi" accept=".json" class="hid"></div>
</div>

<div id="t-cls" class="hid">
<div class="c"><label style="margin-top:0">New class / subject (e.g. Grade 11 Maths)</label><input id="cn">
<button class="p" id="cb">Add class</button></div>
<div class="c"><label style="margin-top:0">Date: check who got the class (scanning always records today)</label><input type="date" id="rd"></div>
<div class="c" id="cl"></div>
</div></div>

<div class="ft">Engineered by <b>GIHAN SANDANU</b></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let db={classes:[],students:[],att:{}};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('tuition',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){let x=null;
 try{const d=await idb();x=await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){}
 if(!x){try{x=JSON.parse(localStorage.getItem('tfs2'))}catch(e){}}
 if(x&&x.students){db=x;db.att=db.att||{}}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
const save=()=>{try{localStorage.setItem('tfs2',JSON.stringify(db))}catch(e){}
 idb().then(d=>d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(db)),'db')).catch(()=>{})};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
$('#rd').value=today();
const given=(s,c,dt)=>(db.att[s.id]||{})[(dt||today())+'|'+c];
const mark=(s,c,dt)=>{(db.att[s.id]=db.att[s.id]||{})[(dt||today())+'|'+c]=nowT();save()};
const unmark=(s,c,dt)=>{if(db.att[s.id])delete db.att[s.id][(dt||today())+'|'+c];save()};
const cls=id=>db.classes.find(c=>c.id===id);
const find=code=>db.students.find(s=>s.id.toLowerCase()===String(code).trim().toLowerCase());
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chk=sel=>db.classes.map(c=>'<label class="ck"><input type="checkbox" value="'+c.id+'"'+(sel.includes(c.id)?' checked':'')+'>'+esc(c.name)+'</label>').join('')||'<small>Add classes first (Classes tab)</small>';
const picked=el=>[...el.querySelectorAll('input:checked')].map(i=>i.value);
const dates=(s,c,m)=>Object.keys(db.att[s.id]||{}).filter(k=>k.endsWith('|'+c)&&k.startsWith(m)).map(k=>k.split('|')[0]).sort();
let tab='scan',editing=null,openH={};

function go(t){tab=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
 ['scan','list','cls'].forEach(k=>$('#t-'+k).classList.toggle('hid',k!==t));
 if(t!=='scan')stopCam();render();if(t==='scan')$('#man').focus()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));
$('#rd').onchange=render;

/* ---------- SCAN ---------- */
function show(code,fresh){
 code=String(code).trim();if(!code)return;
 const s=find(code),r=$('#res');
 if(!s){
  r.className='res nf';
  r.innerHTML='<b style="font-size:22px">New card</b><span>'+esc(code)+'</span><div style="text-align:left"><label>Student name</label><input id="rn"><label>Classes</label><div id="rc">'+chk([])+'</div><button class="p" id="rs">Save student</button></div>';
  $('#rs').onclick=()=>{const n=$('#rn').value.trim();if(!n)return alert('Enter name');db.students.push({id:code,name:n,classes:picked($('#rc'))});save();show(code,true)};
  return}
 const cs=s.classes.map(cls).filter(Boolean);
 let fr=false;
 if(fresh&&cs.length===1&&!given(s,cs[0].id)){mark(s,cs[0].id);fr=true}
 const done=cs.filter(c=>given(s,c.id)).length;
 let cl,tx;
 if(!cs.length){cl='nf';tx='No classes'}
 else if(cs.length===1){cl=fr?'ok':'no';tx=fr?'✅ RECORDED':'⚠️ ALREADY GIVEN TODAY'}
 else{cl=done===cs.length?'ok':'nf';tx=done===cs.length?'✅ ALL DONE TODAY':'👇 Choose class'}
 r.className='res '+cl;
 r.innerHTML='<b style="font-size:28px">'+tx+'</b><span style="font-size:20px;font-weight:700">'+esc(s.name)+'</span><span>'+today()+'</span><div style="text-align:left;margin-top:10px">'+
  cs.map(c=>{const g=given(s,c.id);return '<div class="row"><div class="n">'+esc(c.name)+'</div>'+(g?'<span class="pill ok">Given '+g+'</span><button class="s" data-un="'+c.id+'">Undo</button>':'<button class="s" data-g="'+c.id+'">Give today\'s class</button>')+'</div>'}).join('')+'</div>';
 r.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{mark(s,b.dataset.g);show(code)});
 r.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{unmark(s,b.dataset.un);show(code)});
}
$('#man').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value;e.target.value='';show(v,true)}});
$('#man').addEventListener('blur',()=>setTimeout(()=>{if(tab==='scan'&&!document.activeElement.matches('input,button'))$('#man').focus()},150));

/* camera (optional) */
let stream=null,raf=0,det=null,last='',lt=0;
async function startCam(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){alert('Camera not available. Use the scanner / type the code.');return}
 const v=$('#vid');v.srcObject=stream;v.style.display='block';await v.play();$('#cam').textContent='⏹ Stop camera';
 if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const loop=async()=>{if(!stream)return;
  if(v.readyState>=2){try{let c=null;
   if(det){const r=await det.detect(v);if(r[0])c=r[0].rawValue}
   else if(window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(im.data,im.width,im.height);if(q)c=q.data}
   if(c&&(c!==last||Date.now()-lt>3000)){last=c;lt=Date.now();show(c,true);if(navigator.vibrate)navigator.vibrate(80)}}catch(e){}}
  raf=requestAnimationFrame(loop)};loop()}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}cancelAnimationFrame(raf);$('#vid').style.display='none';$('#cam').textContent='📷 Use phone camera'}
$('#cam').onclick=()=>stream?stopCam():startCam();

/* ---------- STUDENTS ---------- */
function openForm(s){editing=s||null;$('#sf').classList.remove('hid');$('#sn').value=s?s.name:'';$('#sc').value=s?s.id:'';$('#sc').readOnly=!!s;$('#sk').innerHTML=chk(s?s.classes:[]);$('#ss').textContent=s?'Update student':'Save student';$('#sn').focus()}
$('#addtog').onclick=()=>{if($('#sf').classList.contains('hid'))openForm();else $('#sf').classList.add('hid')};
$('#sc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#sn').focus()}});
$('#ss').onclick=()=>{
 const n=$('#sn').value.trim(),id=$('#sc').value.trim();
 if(!n||!id)return alert('Name and card code are required');
 const cl=picked($('#sk'));
 if(editing){editing.name=n;editing.classes=cl}
 else{if(find(id))return alert('This card is already registered');db.students.push({id,name:n,classes:cl})}
 save();$('#sf').classList.add('hid');render()};
$('#q').oninput=render;

function render(){
 const mth=today().slice(0,7);
 const q=$('#q').value.toLowerCase(),L=$('#lst');
 const rows=db.students.filter(s=>(s.name+s.id).toLowerCase().includes(q));
 L.innerHTML=rows.length?'':'<p style="color:var(--mu);text-align:center">No students yet.</p>';
 rows.forEach(s=>{
  const r=document.createElement('div');r.className='row';
  const cs=s.classes.map(cls).filter(Boolean);
  let h='<div class="n" style="flex-basis:100%"><b>'+esc(s.name)+'</b><small>'+esc(s.id)+'</small><div class="chips">'+
   cs.map(c=>'<span class="pill ok">'+esc(c.name)+' · '+dates(s,c.id,mth).length+' this month</span>').join('')+'</div>';
  if(openH[s.id])h+=cs.map(c=>'<small style="margin-top:6px"><b>'+esc(c.name)+':</b> '+(dates(s,c.id,mth).map(d=>d.slice(8)).join(', ')||'—')+'</small>').join('');
  r.innerHTML=h+'</div>';
  const hb=document.createElement('button');hb.className='s';hb.textContent=openH[s.id]?'Hide dates':'Dates';hb.onclick=()=>{openH[s.id]=!openH[s.id];render()};
  const e=document.createElement('button');e.className='s';e.textContent='Edit';e.onclick=()=>{openForm(s);scrollTo(0,0)};
  const x=document.createElement('button');x.className='s d';x.textContent='Delete';
  x.onclick=()=>{if(confirm('Delete '+s.name+'?')){db.students=db.students.filter(z=>z!==s);delete db.att[s.id];save();render()}};
  r.append(hb,e,x);L.append(r)});
 const rd=$('#rd').value||today(),C=$('#cl');
 C.innerHTML=db.classes.length?'':'<p style="color:var(--mu);text-align:center">No classes yet. Add your first one above.</p>';
 db.classes.forEach(c=>{
  const en=db.students.filter(s=>s.classes.includes(c.id)),gv=en.filter(s=>given(s,c.id,rd));
  const w=document.createElement('div');w.style.cssText='border-bottom:1px solid var(--bd);padding:8px 0';
  const h=document.createElement('div');h.className='row';h.style.border='0';
  h.innerHTML='<div class="n"><b>'+esc(c.name)+'</b><small>✅ '+gv.length+' given · ❌ '+(en.length-gv.length)+' not given · '+rd+'</small></div>';
  const x=document.createElement('button');x.className='s d';x.textContent='Delete';
  x.onclick=()=>{if(confirm('Delete class '+c.name+'?')){db.classes=db.classes.filter(z=>z!==c);db.students.forEach(s=>s.classes=s.classes.filter(i=>i!==c.id));save();render()}};
  h.append(x);w.append(h);
  en.forEach(s=>{const g=given(s,c.id,rd),r=document.createElement('div');r.className='row';r.style.padding='6px 0 6px 10px';
   r.innerHTML='<div class="n">'+esc(s.name)+'</div><span class="pill '+(g?'ok':'no')+'">'+(g?'✅ '+g:'❌ Not given')+'</span>';
   const b=document.createElement('button');b.className='s';b.textContent=g?'Undo':'Mark ✅';
   b.onclick=()=>{g?unmark(s,c.id,rd):mark(s,c.id,rd);render()};r.append(b);w.append(r)});
  C.append(w)});
}
$('#cb').onclick=()=>{const n=$('#cn').value.trim();if(!n)return alert('Enter class name');
 db.classes.push({id:'c'+Date.now(),name:n});save();$('#cn').value='';render()};

/* backup */
$('#exp').onclick=()=>{const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(db));a.download='tuition-backup.json';a.click()};
$('#imp').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.students&&x.classes){x.att=x.att||{};db=x;save();render();alert('Restored')}else alert('Not a valid backup')}catch(_){alert('Bad file')}};r.readAsText(f)};
load().then(()=>{render();$('#man').focus()});
</script></body></html>
